name: Build WHAD STM32WL

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      # 1. Compilation de libopencm3 pour l'architecture WL
      - name: Build libopencm3
        run: |
          make -C libopencm3 TARGETS='stm32/wl'

      # 2. Compilation de whad-lib avec définition explicite de l'architecture
      - name: Build whad-lib
        run: |
          cd whad-lib
          # Correction de la syntaxe du Makefile
          sed -i 's/^[[:space:]]\+//' Makefile
          # On définit ARCH pour éviter "Architecture not supported"
          make ARCH=stm32wl
          cd ..

      # 3. Préparation du dossier lib
      - name: Prepare Lib Folder
        run: |
          mkdir -p lib
          cp whad-lib/libwhad.a lib/

      # 4. Compilation finale avec le DEVICE correct
      - name: Build Main Firmware
        run: |
          make DEVICE=stm32wl55cc

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whad-stm32wl-firmware
          path: |
            *.bin
            *.elf
            *.hex
