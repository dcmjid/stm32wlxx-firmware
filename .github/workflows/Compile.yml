name: STM32WLXX Firmware Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Clone repository + submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install ARM GCC toolchain
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      # Debug repository structure
      - name: Debug repository tree
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la

          echo "===== WHAD-LIB ====="
          ls -la whad-lib || true

          echo "===== LIBOPENCM3 ====="
          ls -la libopencm3 || true

      # Create missing directories required by Makefiles
      - name: Create required directories
        run: |
          mkdir -p whad-lib/lib
          mkdir -p lora

      # Verify toolchain
      - name: Show compiler version
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-ar --version

      # Build libopencm3 + whad-lib
      - name: Build libraries
        run: |
          make lib

      # Build NUCLEO_WL55 firmware
      - name: Build NUCLEO_WL55
        run: |
          make nucleo_wl55 -j$(nproc)

      # Build LORA_E5_MINI firmware
      - name: Build LORA_E5_MINI
        run: |
          make lora_e5_mini -j$(nproc)

      # Show generated files
      - name: List generated artifacts
        run: |
          find . -type f \( \
            -name "*.elf" -o \
            -name "*.bin" -o \
            -name "*.hex" -o \
            -name "*.a" \
          \)

      # Upload firmware artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32wlxx-firmware
          path: |
            **/*.elf
            **/*.bin
            **/*.hex
            **/*.a
