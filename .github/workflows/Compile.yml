name: Build WHAD STM32WL

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Build libopencm3
        # On compile la bibliothèque de base en premier
        run: make -C libopencm3

      - name: Build whad-lib
        # On force la compilation de la bibliothèque whad
        run: make -C whad-lib

      - name: Prepare Lib folder
        # On crée le dossier lib et on y place la bibliothèque compilée
        run: |
          mkdir -p lib
          cp whad-lib/libwhad.a lib/

      - name: Build Main Firmware
        # Enfin, on compile le firmware principal
        run: make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32wl-firmware
          path: |
            *.bin
            *.elf
            *.hex
