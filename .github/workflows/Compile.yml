name: Build WHAD STM32WL

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      # Correction ici : On définit DEVICE et TARGETS pour libopencm3
      - name: Build libopencm3
        run: |
          make -C libopencm3 TARGETS='stm32/wl'

      - name: Build whad-lib
        run: |
          cd whad-lib
          # Nettoyage des erreurs de syntaxe potentielles
          sed -i 's/^[[:space:]]\+//' Makefile
          # On passe les flags nécessaires si le Makefile les attend
          make
          cd ..

      - name: Prepare Lib Folder
        run: |
          mkdir -p lib
          cp whad-lib/libwhad.a lib/ 2>/dev/null || echo "Lib already exists"

      - name: Build Main Firmware
        run: make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whad-stm32wl-firmware
          path: |
            *.bin
            *.elf
            *.hex
